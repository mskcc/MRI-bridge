#### general settings
name: ${RUN_NAME}_bridge
use_tb_logger: true
model: denoising
distortion: sr
gpu_ids: [0]

sde:
  lambda_square: 30
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005
  gamma_inv: !!float 1e-7
  
degradation: 
  scale: 1
  
datasets:
  train:
    name: Train_Dataset
    mode: LQGT_5ch_ref_copied_window
    dataroot_GT:  ${DEMO_PATH}/${RUN_NAME}/training/B 
    dataroot_LQ: ${DEMO_PATH}/${RUN_NAME}_windows/training/A
    data_split_pkl: ${DEMO_PATH}/${RUN_NAME}_windows/training.pkl
    use_shuffle: True
    n_workers: 0
    batch_size: 6
    GT_size: 320
    LR_size: 320
    use_flip: True
    use_rot: True
    data_type: img
    vignette: True
  
  val:
    name: Val_Dataset
    mode: LQGT_5ch_ref_copied_window
    dataroot_GT: ${DEMO_PATH}/${RUN_NAME}/validation/B
    dataroot_LQ: ${DEMO_PATH}/${RUN_NAME}_windows/validation/A
    data_split_pkl: ${DEMO_PATH}/${RUN_NAME}_windows/validation.pkl
    GT_size: 320
    use_shuffle: True
    data_type: img
    vignette: True


network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 5
    out_nc: 5
    nf: 64
    depth: 4

#### path
path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

train:
  optimizer: Adam
  lr_G: 0.0001
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 1000000
  warmup_iter: -1
  lr_steps: [100000, 300000]
  lr_gamma: 0.5
  eta_min: 1e-07


  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: 10.0

logger:
  print_freq: 10
  save_checkpoint_freq: 100.0

add_ons:
  center: False
