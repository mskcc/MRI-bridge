name: ${EXPERIMENT_NAME}
model: denoising
distortion: sr
gpu_ids: [0]
slice_id: 2

INDEX_PARALLEL: 0
results_folder: ${DEMO_PATH}

test_slices:

sde:
  lambda_square: 30
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005
  gamma_inv: !!float 1e-7
  
degradation:
  # for super-resolution
  scale: 1

inferences: 1

datasets:
  test:
    # for test
    name: ${RUN_NAME}_softgating
    mode: LQGT_5ch_ref_copied_extend_aug
    dataroot_GT: ${DEMO_PATH}/${RUN_NAME}/test/C
    dataroot_LQ: ${DEMO_PATH}/${RUN_NAME}/test/A
    data_split_pkl: ${DEMO_PATH}/${RUN_NAME}/test.pkl

    GT_size: 320
    LR_size: 320
    vignette: False

#### network structures
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 5
    out_nc: 5
    nf: 64
    depth: 4

network_slab:
  which_model_G: UNet
  setting:
    in_nc: 5
    out_nc: 5
    nf: 64
    depth: 4
  pretrain_model: ${DEMO_PATH}/models/slab_PSNR_best_EMA.pth

test:
  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0
  
#### path
path:
  pretrain_model_G: ${DEMO_PATH}/models/PSNR_best_EMA.pth

### new stuff
add_ons:
  center: False