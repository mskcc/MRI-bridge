#### general settings
name: ${RUN_NAME}_slab
use_tb_logger: true
model: slab
distortion: sr
gpu_ids: [0]


degradation: # for some synthetic dataset that only have GTs
  # for super-resolution
  scale: 1
  
#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: LQGT_5ch_ref_copied_window
    dataroot_GT: ${DEMO_PATH}/${RUN_NAME}/training/B
    dataroot_LQ: ${DEMO_PATH}/${RUN_NAME}_windows/training/A
    data_split_pkl: ${DEMO_PATH}/${RUN_NAME}_windows/training.pkl
    use_shuffle: True
    n_workers: 0
    batch_size: 6
    GT_size: 320
    LR_size: 80
    use_flip: True
    use_rot: True
    scale: 1
    data_type: img
    vignette: True
  
  val:
    name: Val_Dataset
    mode: LQGT_5ch_ref_copied_window
    dataroot_GT: ${DEMO_PATH}/${RUN_NAME}/validation/B
    dataroot_LQ: ${DEMO_PATH}/${RUN_NAME}_windows/validation/A
    data_split_pkl: ${DEMO_PATH}/${RUN_NAME}_windowsvalidation.pkl
    GT_size: 320
    use_shuffle: True
    data_type: img
    vignette: True

#### network structures
network_G:
  which_model_G: UNet
  setting:
    in_nc: 5
    out_nc: 5
    nf: 64
    depth: 4

#### path
path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

#### training settings: learning rate scheme, loss
train:
  optimizer: Adam # Adam, AdamW, Lion
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 1000000
  warmup_iter: -1  # no warm up
  lr_steps: [100000, 300000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 10

#### logger
logger:
  print_freq: 10
  save_checkpoint_freq: !!float 100

### new stuff
add_ons:
  center: False
